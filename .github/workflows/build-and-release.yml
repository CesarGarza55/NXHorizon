name: Build & Release iOS (Unsigned IPA)

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'src/**'
      - 'modules/**'
      - 'plugins/**'
      - 'assets/**'
      - 'App.tsx'
      - 'app.json'
      - 'build.sh'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force compilation even if tag already exists'
        required: false
        type: boolean
        default: false

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check-version:
    name: Check Version & Tag
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.version-check.outputs.should_build }}
      version: ${{ steps.version-check.outputs.version }}
      tag: ${{ steps.version-check.outputs.tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Version against Git Tags
        id: version-check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "Current package.json version: $VERSION"
          echo "Target git tag: $TAG"

          # Fetch remote tags to check existence
          git fetch --tags origin || true

          if git rev-parse "$TAG" >/dev/null 2>&1 && [ "${{ github.event.inputs.force_build }}" != "true" ]; then
            echo "Tag $TAG already exists on remote and force_build is false. Skipping compilation."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "New version detected ($TAG) or force_build enabled. Compilation required."
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          fi

  build-ios:
    name: Build iOS IPA & Publish Release
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup CocoaPods
        run: |
          pod --version

      - name: Build Unsigned iOS IPA
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Generate Checksums & Update SideStore apps.json
        id: post-build
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          TAG="${{ needs.check-version.outputs.tag }}"
          IPA_PATH="build/NXHorizon-unsigned.ipa"

          if [ ! -f "$IPA_PATH" ]; then
            echo "Error: $IPA_PATH was not found after running build.sh!" >&2
            exit 1
          fi

          # 1. Generate SHA256 checksum
          shasum -a 256 "$IPA_PATH" > "build/NXHorizon-unsigned.ipa.sha256"
          cat "build/NXHorizon-unsigned.ipa.sha256"

          # 2. Extract file size in bytes
          IPA_SIZE=$(stat -f%z "$IPA_PATH" 2>/dev/null || stat -c%s "$IPA_PATH")
          echo "IPA Size: $IPA_SIZE bytes"

          # 3. Update apps.json with latest release version info
          DATE_NOW=$(date +%Y-%m-%d)
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/NXHorizon-unsigned.ipa"

          node -e "
            const fs = require('fs');
            const appsJsonPath = 'apps.json';
            const data = JSON.parse(fs.readFileSync(appsJsonPath, 'utf8'));
            const app = data.apps[0];
            if (app) {
              const existingVerIdx = app.versions.findIndex(v => v.version === '$VERSION');
              const verObj = {
                version: '$VERSION',
                date: '$DATE_NOW',
                size: Number('$IPA_SIZE'),
                downloadURL: '$DOWNLOAD_URL',
                localizedDescription: 'Release of NX Horizon $VERSION for iOS.',
                minOSVersion: '15.0'
              };
              if (existingVerIdx >= 0) {
                app.versions[existingVerIdx] = verObj;
              } else {
                app.versions.unshift(verObj);
              }
              fs.writeFileSync(appsJsonPath, JSON.stringify(data, null, 2) + '\n');
              console.log('apps.json successfully updated for version $VERSION');
            }
          "

          # Copy updated apps.json to build/ for release asset upload
          cp apps.json build/apps.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          name: NX Horizon ${{ needs.check-version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/NXHorizon-unsigned.ipa
            build/NXHorizon-unsigned.ipa.sha256
            build/apps.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & Push Updated apps.json to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): update SideStore apps.json to ${{ needs.check-version.outputs.tag }} [skip ci]"
            git push origin main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NXHorizon-iOS-Build
          path: |
            build/NXHorizon-unsigned.ipa
            build/NXHorizon-unsigned.ipa.sha256
            build/apps.json
